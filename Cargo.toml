[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.93"
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "=0.3.43"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
